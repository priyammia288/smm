name = "socio-booster-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

# Runs every minute: broadcasts + order status sync
[triggers]
crons = ["* * * * *"]

# Secrets (set in Cloudflare dashboard -> Worker -> Settings -> Variables and Secrets):
#   BOT_TOKEN       = token from @BotFather
#   SUPABASE_URL    = https://xxxx.supabase.co
#   SUPABASE_KEY    = service_role key (NOT the anon key)
#   OWNER_ID        = your numeric Telegram ID
#   WEBHOOK_SECRET  = any long random string (letters/numbers only)
